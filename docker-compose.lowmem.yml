# Low-memory override for small machines (tested target: 2 cores / 4 threads, 8 GB RAM).
# Usage (from repo root):
#   docker compose -f docker-compose.yml -f docker-compose.lowmem.yml up -d
# or, staged and more reliable on slow CPUs: scripts\up-lowmem.bat
# Does not change the base file: delete this file to go back to defaults.

x-java-small: &java-small
  JAVA_TOOL_OPTIONS: "-Xms64m -Xmx256m -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -Xss512k -XX:MaxMetaspaceSize=160m"

x-pg-small: &pg-small
  command: ["postgres", "-c", "shared_buffers=48MB", "-c", "max_connections=25", "-c", "work_mem=2MB", "-c", "fsync=on"]
  mem_limit: 192m

services:
  db-users:
    <<: *pg-small
  db-security:
    <<: *pg-small
  db-audit:
    <<: *pg-small

  zookeeper:
    environment:
      KAFKA_HEAP_OPTS: "-Xms128m -Xmx256m"
    mem_limit: 400m
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/2181' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  kafka:
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
      KAFKA_ZOOKEEPER_CONNECTION_TIMEOUT_MS: 120000
      KAFKA_ZOOKEEPER_SESSION_TIMEOUT_MS: 60000
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_LOG_RETENTION_HOURS: 24
    mem_limit: 900m
    healthcheck:
      start_period: 180s
      retries: 40

  ms-users:
    environment:
      <<: *java-small
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 4
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: 1
    mem_limit: 450m

  ms-security:
    environment:
      <<: *java-small
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 4
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: 1
    mem_limit: 450m

  ms-audit:
    environment:
      <<: *java-small
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 4
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: 1
    mem_limit: 450m

  app-vaadin:
    environment:
      # Dev mode compiles the frontend with Vite/Node on first start: needs more heap.
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx640m -XX:+UseSerialGC -Xss512k"
    mem_limit: 1400m
