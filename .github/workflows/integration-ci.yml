name: Integration CI

# Brings up the full docker-compose stack (all 4 modules + their
# databases + Kafka) and runs a real end-to-end smoke test over the
# actual Docker network: bootstrap-admin login against ms-security,
# then that token against ms-users' resource server. This is the one
# thing the per-module CI workflows (ms-users-ci.yml, ms-security-ci.yml,
# ms-audit-ci.yml, app-vaadin-ci.yml) can't catch on their own, since
# each of them tests its module in isolation.

on:
  push:
    branches: ["**"]
    paths:
      - "ms-users/**"
      - "ms-security/**"
      - "ms-audit/**"
      - "app-vaadin/**"
      - "docker-compose.yml"
      - ".env.example"
      - ".github/workflows/integration-ci.yml"
  pull_request:
    paths:
      - "ms-users/**"
      - "ms-security/**"
      - "ms-audit/**"
      - "app-vaadin/**"
      - "docker-compose.yml"
      - ".env.example"
      - ".github/workflows/integration-ci.yml"

jobs:
  compose-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build images
        run: docker compose build

      - name: Start the stack
        run: docker compose up -d

      - name: Wait for ms-users, ms-security, ms-audit health endpoints
        run: |
          for port in 8081 8082 8083; do
            echo "Waiting for service on port $port..."
            for i in $(seq 1 60); do
              status=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:${port}/actuator/health" || true)
              if [ "$status" = "200" ]; then
                echo "Port $port is healthy."
                break
              fi
              if [ "$i" = "60" ]; then
                echo "Port $port never became healthy after 10 minutes."
                exit 1
              fi
              sleep 10
            done
          done

      - name: Wait for ms-security JWKS endpoint
        run: |
          for i in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8082/.well-known/jwks.json || true)
            if [ "$status" = "200" ]; then
              echo "JWKS is reachable."
              break
            fi
            if [ "$i" = "30" ]; then
              echo "JWKS never became reachable."
              exit 1
            fi
            sleep 5
          done

      - name: Smoke test - bootstrap admin login + cross-service JWT validation
        env:
          # The bootstrap admin is seeded by ms-security's V3__SeedBootstrapAdmin with password
          # "admin" (BOOTSTRAP_ADMIN_PASSWORD is unset here) and must_reset_password=TRUE, so the
          # first login only yields a resetToken. This throwaway password lives only in this
          # ephemeral CI stack (torn down with -v below) and is never echoed.
          NEW_ADMIN_PASSWORD: CiSmokeTest#2026
        run: |
          set -e
          # Hide token values when echoing responses.
          redact() { sed -E 's/"(accessToken|refreshToken|resetToken)":"[^"]+"/"\1":"<redacted>"/g'; }

          # 1. First login with the bootstrap password: expect a forced-reset response with a resetToken.
          response=$(curl -s -X POST http://localhost:8082/login \
            -H "Content-Type: application/json" \
            -d '{"username":"admin","password":"admin"}')
          echo "First login response: $(echo "$response" | redact)"

          reset_token=$(echo "$response" | sed -n 's/.*"resetToken":"\([^"]*\)".*/\1/p')
          if [ -z "$reset_token" ]; then
            echo "No resetToken in the first login response: the bootstrap admin should require a forced password reset."
            exit 1
          fi

          # 2. Complete the forced reset: expect 204.
          status=$(curl -s -o /tmp/reset_response.json -w '%{http_code}' \
            -X POST http://localhost:8082/login/reset-password \
            -H "Content-Type: application/json" \
            -d "{\"resetToken\":\"$reset_token\",\"newPassword\":\"$NEW_ADMIN_PASSWORD\"}")
          echo "Reset-password status: $status $(cat /tmp/reset_response.json)"
          if [ "$status" != "204" ]; then
            echo "Expected 204 from POST /login/reset-password, got $status."
            exit 1
          fi

          # 3. Log in again with the new password: expect an accessToken.
          response=$(curl -s -X POST http://localhost:8082/login \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"admin\",\"password\":\"$NEW_ADMIN_PASSWORD\"}")
          echo "Second login response: $(echo "$response" | redact)"

          token=$(echo "$response" | sed -n 's/.*"accessToken":"\([^"]*\)".*/\1/p')
          if [ -z "$token" ]; then
            echo "No access token in the login response after the password reset."
            exit 1
          fi

          # 4. Cross-service JWT validation: ms-security's token must be accepted by ms-users.
          status=$(curl -s -o /tmp/users_response.json -w '%{http_code}' \
            http://localhost:8081/users \
            -H "Authorization: Bearer $token")
          echo "GET /users response: $(cat /tmp/users_response.json)"

          if [ "$status" != "200" ]; then
            echo "Expected 200 from GET /users with a bootstrap-admin token, got $status."
            exit 1
          fi

          # 5. Authentication is mandatory: the same call without a token must be rejected.
          status=$(curl -s -o /tmp/users_anon_response.json -w '%{http_code}' \
            http://localhost:8081/users)
          echo "GET /users without token response: $status $(cat /tmp/users_anon_response.json)"

          if [ "$status" != "401" ]; then
            echo "Expected 401 from GET /users without a token, got $status."
            exit 1
          fi

      - name: Dump service logs
        if: always()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
